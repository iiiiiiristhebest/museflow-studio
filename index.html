async function addAudio(file,name){if(tracks.length>=8)return toast('当前最多 8 条音轨，请先移除不需要的导入音轨');try{const data=await decode(file);pause();tracks.push({id:crypto.randomUUID(),name:(name||file.name).slice(0,20),data,volume:85,pan:0,mute:false,solo:false,imported:true,color:COLORS[tracks.length%COLORS.length]});snapVersion(name?'人声录入':'音频导入');await store();tab='arrange';render();toast('音频已加入，可独奏试听或导出混音')}catch(e){toast(e.message||'无法解码音频，请换 WAV 或 MP3 文件')}}
async function toggleRecording(){if(rec?.state==='recording'){rec.stop();return}if(tracks.length>=8)return toast('最多 8 条音轨，请先移除一条');try{await audioContext();recStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});recChunks=[];rec=new MediaRecorder(recStream);rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};rec.onstop=async()=>{clearInterval(recTimer);pause();recStream.getTracks().forEach(t=>t.stop());const blob=new Blob(recChunks,{type:rec.mimeType});await addAudio(blob,'人声 · 我的录唱')};pause();offset=0;state.loop=false;$('#loop').style.color='';rec.start();recStart=Date.now();$('#recordToggle').classList.add('recording');$('#recordHint').textContent='正在录音 · 再次点击结束';if($('#monitor').checked)await play(0);recTimer=setInterval(()=>{if($('#recordTime'))$('#recordTime').textContent=fmt((Date.now()-recStart)/1000);if(Date.now()-recStart>120000&&rec.state==='recording')rec.stop()},200)}catch(e){recStream?.getTracks().forEach(t=>t.stop());toast('无法使用麦克风。请允许权限，或使用“导入已有录音”。')}}
function mix(start=0,end=length()){const n=Math.max(1,Math.floor((end-start)*SR)),l=new Float32Array(n),r=new Float32Array(n),solo=tracks.some(t=>t.solo);for(const t of tracks){if(t.mute||(solo&&!t.solo))continue;const angle=(t.pan/100+1)*Math.PI/4,g=t.volume/100*state.master/100;for(let i=0;i<n;i++){const v=t.data[i+Math.floor(start*SR)]||0;l[i]+=v*g*Math.cos(angle);r[i]+=v*g*Math.sin(angle)}}let peak=0;for(let i=0;i<n;i++)peak=Math.max(peak,Math.abs(l[i]),Math.abs(r[i]));const norm=peak>.98?.98/peak:1;return {l,r,norm}}
function wav(l,r,norm=1){let ab=new ArrayBuffer(44+l.length*4),v=new DataView(ab),put=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};put(0,'RIFF');v.setUint32(4,ab.byteLength-8,true);put(8,'WAVE');put(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,SR,true);v.setUint32(28,SR*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);put(36,'data');v.setUint32(40,l.length*4,true);for(let i=0;i<l.length;i++){v.setInt16(44+i*4,Math.max(-1,Math.min(1,l[i]*norm))*32767,true);v.setInt16(46+i*4,Math.max(-1,Math.min(1,r[i]*norm))*32767,true)}return new Blob([ab],{type:'audio/wav'})}
function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function exportDialog(){modal(`<h2>导出你的作品</h2><p>导出会应用当前音量、声像、静音与独奏设置。超过峰值时自动降低整体音量，避免削波。</p><label for="exportRange">范围</label><select id="exportRange"><option value="all">完整作品 · ${fmt(length())}</option><option value="selection">当前选区 · ${(state.end-state.start).toFixed(1)} 秒</option></select><p class="small">立体声 WAV · 22.05 kHz · 16-bit PCM</p><div class="actions"><button id="jsonExport">项目 JSON（含音频）</button><button class="primary" id="wavExport">下载混音 WAV</button></div><div class="actions"><button data-close>关闭</button></div>`)}
function to64(a){const u=new Uint8Array(a.buffer,a.byteOffset,a.byteLength);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s)}
function from64(s){let b=atob(s);if(b.length%4)throw Error('音频数据无效');const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Float32Array(u.buffer)}
function jsonExport(){const data={format:'museflow-studio',version:1,sampleRate:SR,state,tracks:tracks.map(t=>({...t,data:to64(t.data)}))};download(new Blob([JSON.stringify(data)],{type:'application/json'}),state.title+'.museflow.json');toast('项目已导出，包含音频、歌词与混音参数')}
async function loadProject(p){pause();state={...p.state};tracks=p.tracks.map(t=>({...t,data:new Float32Array(t.data)}));versions=[];vi=0;snapVersion('打开的草稿');offset=0;page='studio';tab='arrange';$('#master').value=state.master;await store();render()}
async function newProject(){await store();pause();state={...state,id:crypto.randomUUID(),title:'未命名作品',lyrics:'',inspiration:'',start:15,end:30,loop:false};tracks=defaultTracks();versions=[];vi=0;snapVersion('初始编配');offset=0;page='studio';tab='arrange';await store();render();rename()}
function share(){modal(`<h2>作品卡片</h2><div class="publishcard"><span class="small" style="color:#c4d2df">MuseFlow · 我的原创片段</span><h3>${esc(state.title)}</h3><span>${state.style} / ${state.bpm} BPM / ${fmt(length())}</span></div><label for="caption">分享文案</label><input id="caption" type="text" value="我做了一段《${esc(state.title)}》，想邀请你一起唱。"><p>可下载卡片 PNG，与导出的音频一起分享。这里不会代你发布到平台。</p><div class="actions"><button data-close>关闭</button><button class="primary" id="cardDownload">下载作品卡片</button></div>`)}
function cardDownload(){let c=document.createElement('canvas');c.width=1080;c.height=1080;const g=c.getContext('2d');g.fillStyle='#263c53';g.fillRect(0,0,1080,1080);g.strokeStyle='#7796ae33';g.lineWidth=2;for(let x=-1000;x<2000;x+=45){g.beginPath();g.moveTo(x,0);g.lineTo(x+800,1080);g.stroke()}g.fillStyle='#efa49d';g.font='italic bold 48px Georgia';g.fillText('museflow.',80,120);g.fillStyle='#e8edf5';g.font='52px Microsoft YaHei';let title=state.title;while(g.measureText(title).width>920&&title.length>1)title=title.slice(0,-1);g.fillText(title,80,560);g.font='25px Microsoft YaHei';g.fillText(state.style+' / '+state.bpm+' BPM / '+fmt(length()),80,625);g.font='22px Microsoft YaHei';const caption=$('#caption').value;let line='',y=840;for(const ch of caption){if(g.measureText(line+ch).width>900){g.fillText(line,80,y);line=ch;y+=38;if(y>970)break}else line+=ch}g.fillText(line,80,y);c.toBlob(b=>download(b,state.title+'_作品卡.png'))}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(busy){toast('正在完成编配，请稍候');return}if(b.dataset.close!==undefined)return close();if(rec?.state==='recording'&&!['recordToggle','play'].includes(b.id)){toast('请先结束录音');return}if(b.dataset.page){page=b.dataset.page;render();return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.style){state.style=b.dataset.style;$$('[data-style]').forEach(x=>x.classList.toggle('active',x.dataset.style===state.style));scheduleSave();return}if(b.dataset.mute!==undefined||b.dataset.solo!==undefined){let k=b.dataset.mute!==undefined?'mute':'solo',i=+(b.dataset.mute??b.dataset.solo);tracks[i][k]=!tracks[i][k];applyGains();b.classList.toggle('on',tracks[i][k]);scheduleSave();drawWaves();return}if(b.dataset.version!==undefined)return restore(+b.dataset.version);if(b.dataset.remove!==undefined){pause();tracks.splice(+b.dataset.remove,1);snapVersion('移除音轨');store();render();return}if(b.dataset.open){const list=await projects();return loadProject(list.find(p=>p.id===b.dataset.open))}if(b.dataset.delete){if(!confirm('删除这个本地项目？此操作不可撤销。'))return;const d=await db();const tx=d.transaction('projects','readwrite');tx.objectStore('projects').delete(b.dataset.delete);tx.oncomplete=()=>{d.close();renderPage()};return}if(b.dataset.template){const t=JSON.parse(b.dataset.template);state.style=t.style;state.bpm=t.bpm;state.energy=t.energy;state.inspiration=t.desc;page='studio';render();toast('已填入编配参数；点击生成后应用到选区');return}switch(b.id){case 'play':playing?pause():play();break;case 'rewind':seek(0);break;case 'loop':state.loop=!state.loop;b.style.color=state.loop?'var(--pink)':'';toast(state.loop?'循环选区已开启':'循环已关闭');break;case 'speaker':state.master=state.master?0:75;$('#master').value=state.master;if(masterNode)masterNode.gain.value=state.master/100;break;case 'rename':rename();break;case 'renameOk':let t=$('#newTitle').value.trim();if(!t)return toast('请填写作品名称');state.title=t;close();store();render();break;case 'upload':case 'uploadInRecord':$('#audiofile').click();break;case 'previewSelection':seek(state.start);state.loop=true;$('#loop').style.color='var(--pink)';play(state.start);break;case 'undo':restore(Math.max(0,vi-1));break;case 'redo':restore(Math.min(versions.length-1,vi+1));break;case 'snapshot':snapVersion('手动快照 '+(versions.length+1));render();toast('已保存当前混音快照');break;case 'generate':generate();break;case 'recordToggle':toggleRecording();break;case 'verse':case 'chorus':state.lyrics+=(state.lyrics?'\n\n':'')+(b.id==='verse'?'[主歌]':'[副歌]')+'\n';render();$('#lyrics').focus();scheduleSave();break;case 'downloadLyrics':download(new Blob([state.lyrics],{type:'text/plain;charset=utf-8'}),state.title+'_歌词.txt');break;case 'saveProject':if(await store())toast('项目、歌词与音轨已保存在当前浏览器');break;case 'exportOpen':exportDialog();break;case 'jsonExport':jsonExport();break;case 'wavExport':let sel=$('#exportRange').value==='selection',m=mix(sel?state.start:0,sel?state.end:length());download(wav(m.l,m.r,m.norm),state.title+(sel?'_选区':'_混音')+'.wav');toast('已导出真实混音 WAV');break;case 'importProject':$('#projectfile').click();break;case 'newProject':newProject();break;case 'share':share();break;case 'cardDownload':cardDownload();break;case 'help':modal('<h2>这是可以操作的录音室</h2><p>单击波形定位，拖动选择片段，双击播放。M 静音、S 独奏，滑杆控制音量与声像。按空格播放或暂停。</p><p>编配变体会实际改变本地合成音轨；导入音频可播放、混音、录音叠加与导出。歌词和灵感分别保存。</p><p>MuseFlow 是独立的网页音乐创作工具原型，不内置于全民 K 歌，也未接入腾讯音乐账号或发布服务。当前未连接 AI 模型。当前编配是参数驱动的本地合成，不能把文字自动生成为歌曲。作品保存在本机浏览器，建议导出项目 JSON 备份。</p><div class="actions"><button class="primary" data-close>开始创作</button></div>');break}});
document.addEventListener('input',e=>{if(e.target.dataset.volume!==undefined){let t=tracks[+e.target.dataset.volume];t.volume=+e.target.value;e.target.nextElementSibling.value=t.volume;applyGains();scheduleSave()}if(e.target.dataset.pan!==undefined){tracks[+e.target.dataset.pan].pan=+e.target.value;applyGains();scheduleSave()}});
$('#master').oninput=e=>{state.master=+e.target.value;if(masterNode)masterNode.gain.value=state.master/100;scheduleSave()};$('#seek').oninput=e=>seek(+e.target.value);
$('#audiofile').onchange=async e=>{const f=e.target.files?.[0];if(f)await addAudio(f);e.target.value=''};
$('#projectfile').onchange=async e=>{try{const f=e.target.files?.[0];if(!f)return;if(f.size>100*1024*1024)throw Error('项目文件超过 100 MB');const p=JSON.parse(await f.text());if(p.format!=='museflow-studio'||p.version!==1||p.sampleRate!==SR||!Array.isArray(p.tracks)||p.tracks.length<1||p.tracks.length>8)throw Error('不支持的项目格式');const data=p.tracks.map((t,i)=>{let a=from64(t.data);if(a.length>SR*120||!a.length||a.some(v=>!Number.isFinite(v)))throw Error('音轨数据无效');return {...t,data:a,name:String(t.name).slice(0,30),color:COLORS[i%COLORS.length],volume:Math.max(0,Math.min(100,Number(t.volume)||0)),pan:Math.max(-100,Math.min(100,Number(t.pan)||0))}});await loadProject({state:{...state,...p.state,id:crypto.randomUUID()},tracks:data});toast('项目已导入')}catch(e){toast(e.message||'导入失败')}finally{e.target.value=''}};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement.tagName)&&!$('#modal').open){e.preventDefault();playing?pause():play()}});window.addEventListener('resize',()=>requestAnimationFrame(drawWaves));window.addEventListener('beforeunload',()=>{recStream?.getTracks().forEach(t=>t.stop())});
(async()=>{const list=await projects(),last=localStorage.getItem('museflow-v4-last'),p=list.find(x=>x.id===last);if(p){state={...state,...p.state};tracks=p.tracks.map(t=>({...t,data:new Float32Array(t.data)}))}else tracks=defaultTracks();snapVersion('初始编配');$('#master').value=state.master;render();await store();tick()})();
</script></body></html>
